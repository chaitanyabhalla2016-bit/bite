<!-- contact.html -->
<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Bite</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/utilities.css">
    <link rel="stylesheet" href="./css/contact.css">
</head>
<body>
    <section class="container-fluid section-padding">
        <div class="container-lg">
            <div class="text-center mb-5">
                <h1 class="display-3 text-warning mb-4">
                    Contact Us
                </h1>
                <p class="lead">
                    We'd love to hear from you.
                </p>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <form class="contact-form p-5">
                        <div class="form-floating mb-4">
                            <input type="text"
                                class="form-control"
                                placeholder="Name">
                            <label>Name</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="email"
                                class="form-control"
                                placeholder="Email">
                            <label>Email</label>
                        </div>
                        <div class="form-floating mb-4">
                            <textarea class="form-control"
                                placeholder="Message"
                                style="height:200px"></textarea>
                            <label>Message</label>
                        </div>
                        <button class="btn btn-warning btn-lg">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
        <footer class="container-fluid border-top border-secondary-subtle mt-5">
        <div class="container-lg py-5">
            <div class="row gy-4">
                <div class="col-lg-4">
                    <h3 class="text-warning mb-3">Bite</h3>
                    <p>
                        Discover recipes you'll crave again.
                    </p>
                </div>
                <div class="col-lg-2">
                    <h5 class="mb-3">Explore</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="index.html" class="footer-link">Home</a></li>
                        <li class="mb-2"><a href="recipes.html" class="footer-link">Recipes</a></li>
                        <li class="mb-2"><a href="favorites.html" class="footer-link">Favorites</a></li>
                    </ul>
                </div>
                <div class="col-lg-2">
                    <h5 class="mb-3">Categories</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="#" class="footer-link">Pizza</a></li>
                        <li class="mb-2"><a href="#" class="footer-link">Desserts</a></li>
                        <li class="mb-2"><a href="#" class="footer-link">Healthy</a></li>
                    </ul>
                </div>
                <div class="col-lg-4">
                    <h5 class="mb-3">Follow Us</h5>
                    <div class="d-flex gap-3 fs-4">
                        <i class="bi bi-instagram"></i>
                        <i class="bi bi-twitter-x"></i>
                        <i class="bi bi-youtube"></i>
                    </div>
                </div>
            </div>
        </div>
    </footer> 
</body>
</html>
