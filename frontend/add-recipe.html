<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="card-title mb-4 text-center">Add a New Recipe</h2>
                    
                    <form id="add-recipe-form">
                        
                        <!-- Recipe Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label text-capitalize text-warning fs-5 fw-light">Recipe Title</label>
                            <input type="text" class="form-control" id="title"  name="title" placeholder="e.g., Classic Chocolate Chip Cookies">
                        </div>
                        <!-- Recipe Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label text-capitalize text-warning fs-5 fw-light">Recipe Description</label>
                            <input type="text" class="form-control" id="description"  name="description" placeholder="e.g., A blend of...">
                        </div>

                        <!-- Category & Prep Time -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="category" class="form-label text-capitalize text-warning fs-5 fw-light">Category</label>
                                <select class="form-select" id="category"  name="category">
                                    <option selected disabled value="">Choose category...</option>
                                    <option value="Italian">Italian</option>
                                    <option value="Indian">Indian</option>
                                    <option value="American">American</option>
                                    <option value="Japanese">Japanese</option>
                                    <option value="Seafood">Seafood</option>
                                    <option value="Dessert">Dessert</option>
                                    <option value="Healthy">Healthy</option>
                                    <option value="Mexican">Mexican</option>
                                    <option value="French">French</option>
                                    <option value="Thai">Thai</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="cookTime" class="form-label text-capitalize text-warning fs-5 fw-light">Prep Time (Minutes)</label>
                                <input type="number" class="form-control" id="cookTime"  name="cookTime" placeholder="e.g., 30" min="1">
                            </div>
                        </div>

                        <!-- Difficulty & Rating -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="difficulty" class="form-label text-capitalize text-warning fs-5 fw-light">Difficulty</label>
                                <select class="form-select" id="difficulty"  name="difficulty">
                                    <option selected disabled value="">Choose difficulty...</option>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Hard">Hard</option>
                                </select>
                            </div>
                            <!-- <div class="col-md-6">
                                <label for="rating" class="form-label text-capitalize text-warning fs-5 fw-light">Rating</label>
                                <input type="number" class="form-control" id="rating"  name="rating" placeholder="e.g., 1 to 5" min="1" max="5">
                            </div> -->
                            <div class="col-md-6">
                                <label for="servings" class="form-label text-capitalize text-warning fs-5 fw-light">Serves (Number)</label>
                                <input type="number" class="form-control" id="servings"  name="servings" placeholder="e.g., 1 or 5 or ..." min="1">
                            </div>
                        </div>

                        <!-- Ingredients Container -->
                        <!-- <div class="mb-3">
                            <label class="form-label text-capitalize text-warning fs-5 fw-light">Ingredients</label>
                            <div id="ingredients-  name="ingredients-container">
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control" name="ingredients[]" placeholder="e.g., 2 cups flour">
                                    <button class="btn btn-outline-danger remove-ingredient" type="button" disabled>Remove</button>
                                </div>
                            </div>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="add-  name="add-ingredient">+ Add Ingredient</button>
                        </div> -->
                        <div class="mb-3">
                            <label for="ingredients" class="form-label text-capitalize text-warning fs-5 fw-light">Ingredients</label>
                            <textarea class="form-control" id="ingredients"  name="ingredients" rows="5" placeholder="Enter ingredients here. e.g., 2 cups flour..."></textarea>
                        </div>

                        <!-- Instructions Textarea -->
                        <div class="mb-3">
                            <label for="steps" class="form-label text-capitalize text-warning fs-5 fw-light">Instructions</label>
                            <textarea class="form-control" id="steps"  name="steps" rows="5" placeholder="Enter step-by-step instructions here..."></textarea>
                        </div>

                        <!-- Nutrition values -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label for="calories" class="form-label text-capitalize text-warning fs-5 fw-light">calories (KCals)</label>
                                <input type="number" class="form-control" id="calories"  name="calories" placeholder="Just number. e.g., 25" min="1">
                            </div>
                            <div class="col-md-3">
                                <label for="protein" class="form-label text-capitalize text-warning fs-5 fw-light">Protein (g)</label>
                                <input type="number" class="form-control" id="protein"  name="protein" placeholder="Just number. e.g., 25" min="1">
                            </div>
                            <div class="col-md-3">
                                <label for="carbs" class="form-label text-capitalize text-warning fs-5 fw-light">carbs (g)</label>
                                <input type="number" class="form-control" id="carbs"  name="carbs" placeholder="Just number. e.g., 25" min="1">
                            </div>
                            <div class="col-md-3">
                                <label for="fat" class="form-label text-capitalize text-warning fs-5 fw-light">fats (g)</label>
                                <input type="number" class="form-control" id="fat"  name="fat" placeholder="Just number. e.g., 25" min="1">
                            </div>
                        </div>

                        <!-- Recipe Image -->
                        <div class="mb-4">
                            <label for="image" class="form-label text-capitalize text-warning fs-5 fw-light">Recipe Image Filename</label>
                            <input class="form-control" type="text" id="image"  name="image" accept="image/*">
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" id="recipeFormBtn" class="btn btn-primary btn-lg">Save Recipe</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
